<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nebula Visualizer</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <div class="stage" id="stage">
      <canvas id="c" width="1920" height="1080"></canvas>
      <div class="vbtns">
        <button class="vbtn" id="barToggle" type="button" aria-pressed="true" aria-label="Hide play bar"
          title="Hide play bar"></button>
        <button class="vbtn" id="fsBtn" type="button" aria-label="Full screen" title="Full screen"></button>
      </div>
      <div class="seekrow">
        <button id="play" class="round" disabled aria-label="Play"></button>
        <span id="time">0:00.0 / 0:00.0</span>
        <input type="range" id="seek" min="0" max="1000" step="1" value="0" disabled aria-label="Song position">
      </div>
    </div>
    <div class="bar">
      <label>Artist<input type="text" id="artist" value="" placeholder="Artist"></label>
      <label>Song title<input type="text" id="title" value="" placeholder="Song title"></label>
      <label>Extra info<input type="text" id="extra" value="" placeholder="(Feat. other), (VIP Mix), ..."></label>
      <label class="btn">Choose song<input type="file" id="song" accept="audio/*"></label>
      <label class="btn">Choose cover<input type="file" id="cover" accept="image/*"></label>
    </div>
    <div class="groups">
      <details class="group" open>
        <summary>Colors</summary>
        <div class="group-body">
          <div class="settings-row">
            <label class="toggle"><input type="checkbox" id="gradient"> Gradient</label>
            <label class="toggle"><input type="checkbox" id="overlayColors"> Overlay colors</label>
          </div>
          <div class="color-tools">
            <div class="palette-control">
              <div class="palette-heading"><span class="swatch" id="colorSwatch"></span> Main color</div>
              <div class="hue-wheel" id="colorWheel" role="group" aria-label="Main color picker">
                <span class="hue-knob" id="colorHueKnob"></span>
                <div class="sv-square" id="colorSV" style="--hue:#ff0000"><span class="sv-knob" id="colorSVKnob"></span>
                </div>
              </div>
              <div class="rgb-row">
                <input type="text" class="hex-in" id="colorHexIn" maxlength="7" spellcheck="false"
                  aria-label="Main color hex">
                <input type="number" id="colorR" min="0" max="255" aria-label="Main color red">
                <input type="number" id="colorG" min="0" max="255" aria-label="Main color green">
                <input type="number" id="colorB" min="0" max="255" aria-label="Main color blue">
              </div>
            </div>
            <div class="palette-control" id="endColorWrap" hidden>
              <div class="palette-heading"><span class="swatch" id="endSwatch"></span> Gradient end</div>
              <div class="hue-wheel" id="endWheel" role="group" aria-label="Gradient end color picker">
                <span class="hue-knob" id="endHueKnob"></span>
                <div class="sv-square" id="endSV" style="--hue:#ff0000"><span class="sv-knob" id="endSVKnob"></span>
                </div>
              </div>
              <div class="rgb-row">
                <input type="text" class="hex-in" id="endHexIn" maxlength="7" spellcheck="false"
                  aria-label="Gradient end hex">
                <input type="number" id="endR" min="0" max="255" aria-label="Gradient end red">
                <input type="number" id="endG" min="0" max="255" aria-label="Gradient end green">
                <input type="number" id="endB" min="0" max="255" aria-label="Gradient end blue">
              </div>
            </div>
          </div>
        </div>
      </details>
      <details class="group">
        <summary>Background</summary>
        <div class="group-body">
          <div class="settings-row">
            <label class="toggle"><input type="checkbox" id="bgGradient"> Gradient</label>
          </div>
          <div class="color-tools">
            <div class="palette-control">
              <div class="palette-heading"><span class="swatch" id="bgSwatch"></span> Background color</div>
              <div class="hue-wheel" id="bgWheel" role="group" aria-label="Background color picker">
                <span class="hue-knob" id="bgHueKnob"></span>
                <div class="sv-square" id="bgSV" style="--hue:#ff0000"><span class="sv-knob" id="bgSVKnob"></span></div>
              </div>
              <div class="rgb-row">
                <input type="text" class="hex-in" id="bgHexIn" maxlength="7" spellcheck="false"
                  aria-label="Background color hex">
                <input type="number" id="bgR" min="0" max="255" aria-label="Background red">
                <input type="number" id="bgG" min="0" max="255" aria-label="Background green">
                <input type="number" id="bgB" min="0" max="255" aria-label="Background blue">
              </div>
            </div>
            <div class="palette-control" id="bgEndWrap" hidden>
              <div class="palette-heading"><span class="swatch" id="bgEndSwatch"></span> Background gradient end</div>
              <div class="hue-wheel" id="bgEndWheel" role="group" aria-label="Background gradient end color picker">
                <span class="hue-knob" id="bgEndHueKnob"></span>
                <div class="sv-square" id="bgEndSV" style="--hue:#ff0000"><span class="sv-knob" id="bgEndSVKnob"></span>
                </div>
              </div>
              <div class="rgb-row">
                <input type="text" class="hex-in" id="bgEndHexIn" maxlength="7" spellcheck="false"
                  aria-label="Background gradient end hex">
                <input type="number" id="bgEndR" min="0" max="255" aria-label="Background gradient end red">
                <input type="number" id="bgEndG" min="0" max="255" aria-label="Background gradient end green">
                <input type="number" id="bgEndB" min="0" max="255" aria-label="Background gradient end blue">
              </div>
            </div>
          </div>
          <div class="settings-row" id="bgDirRow" hidden>
            <span class="seglabel">Direction</span>
            <div class="dir-dial" id="bgDial" role="slider" tabindex="0" aria-label="Background gradient angle"
              aria-valuemin="0" aria-valuemax="359" aria-valuenow="180"
              title="Drag to set the angle. Shift = 15° steps, Alt = no snapping"><span class="dial-line"></span></div>
            <div class="dir-side">
              <div class="seg" id="bgDirection" role="group" aria-label="Background gradient direction presets">
                <button type="button" data-angle="0" aria-pressed="false" aria-label="Gradient direction: Bottom to top"
                  title="Bottom to top">↑</button>
                <button type="button" data-angle="45" aria-pressed="false"
                  aria-label="Gradient direction: Bottom left to top right" title="Bottom left to top right">↗</button>
                <button type="button" data-angle="90" aria-pressed="false"
                  aria-label="Gradient direction: Left to right" title="Left to right">→</button>
                <button type="button" data-angle="135" aria-pressed="false"
                  aria-label="Gradient direction: Top left to bottom right" title="Top left to bottom right">↘</button>
                <button type="button" data-angle="180" aria-pressed="true"
                  aria-label="Gradient direction: Top to bottom" title="Top to bottom">↓</button>
                <button type="button" data-angle="225" aria-pressed="false"
                  aria-label="Gradient direction: Top right to bottom left" title="Top right to bottom left">↙</button>
                <button type="button" data-angle="270" aria-pressed="false"
                  aria-label="Gradient direction: Right to left" title="Right to left">←</button>
                <button type="button" data-angle="315" aria-pressed="false"
                  aria-label="Gradient direction: Bottom right to top left" title="Bottom right to top left">↖</button>
              </div>
              <label class="toggle">Angle <input type="number" class="angle-in" id="bgAngleIn" min="0" max="360"
                  step="1" value="180" aria-label="Gradient angle in degrees">°</label>
            </div>
          </div>
        </div>
      </details>
      <details class="group" open>
        <summary>Sound</summary>
        <div class="group-body">
          <div class="settings-row">
            <label class="sens">Sensitivity<input type="range" id="sens" min="0.4" max="1.6" step="0.05"
                value="1"></label>
          </div>
        </div>
      </details>
      <details class="group">
        <summary>Stars</summary>
        <div class="group-body">
          <div class="settings-row">
            <label class="toggle"><input type="checkbox" id="starsOn" checked> Show stars</label>
          </div>
          <div id="starOpts">
            <div class="settings-row">
              <label class="sens">Density<input type="range" id="starDensity" min="20" max="600" step="10"
                  value="240"></label>
              <label class="sens">Speed<input type="range" id="starSpeed" min="0" max="3" step="0.05" value="1"></label>
              <label class="sens">Boost<input type="range" id="starBoost" min="0" max="30" step="0.5" value="8"></label>
            </div>
            <div class="settings-row">
              <label class="toggle"><input type="checkbox" id="starFlash" checked> Light up on beat</label>
              <label class="sens">Intensity<input type="range" id="starLight" min="0" max="3" step="0.05"
                  value="1"></label>
            </div>
            <div class="settings-row">
              <span class="seglabel">Direction</span>
              <div class="seg" id="starDirection" role="group" aria-label="Star movement direction">
                <button type="button" data-dir="up" aria-pressed="false" aria-label="Move up" title="Up">↑</button>
                <button type="button" data-dir="down" aria-pressed="false" aria-label="Move down"
                  title="Down">↓</button>
                <button type="button" data-dir="left" aria-pressed="true" aria-label="Move left" title="Left">←</button>
                <button type="button" data-dir="right" aria-pressed="false" aria-label="Move right"
                  title="Right">→</button>
              </div>
            </div>
          </div>
        </div>
      </details>
    </div>
    <div id="status">Choose a song to begin. The bars react to the audio.</div>
  </main>

  <script src="script.js"></script>
</body>

</html>
